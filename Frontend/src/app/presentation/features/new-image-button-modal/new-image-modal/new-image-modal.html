<div class="backdrop" (click)="closeModal()"></div>

<div class="modal">
    <h2>Nuevo caso</h2>

    <input 
        type="file" 
        accept="image/*" 
        capture="environment"
        (change)="onFileChange($event)" 
    />

    <label>Hipótesis del médico</label>
    <select (change)="hypothesis.set($any($event.target).value)">
        <option value="">Selecciona una opción</option>

        <option value="BKL">Queratosis benigna</option>
        <option value="NV">Nevo melanocítico</option>
        <option value="MEL">Melanoma</option>
        <option value="BCC">Carcinoma basocelular</option>
        <option value="AK">Queratosis actínica</option>
        <option value="DF">Dermatofibroma</option>
        <option value="VASC">Lesión vascular</option>
        <option value="SCC">Carcinoma de células escamosas</option>
        <option value="?">Otro / No identificado</option>
    </select>

    @if(errorMessage()) {
        <p class="error">
            {{ errorMessage() }}
        </p>
    }
    <div class="actions">
        <button (click)="submit()" [disabled]="!selectedFile() || isLoading()">
            {{ isLoading() ? 'Analizando...' : 'Analizar' }}
        </button>
        <button (click)="closeModal()">Cancelar</button>
    </div>
</div>
